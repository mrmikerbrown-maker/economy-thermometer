# Temporary: runs the compass data checks on the build branch only. Removed before merge.
name: Compass data check
on:
  push:
    branches: [claude/economic-compass]
    paths: ["_check/**", ".github/workflows/compass-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _check/check_history.py
      - name: Save report to the branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _check/report.txt
          git commit -m "Compass data check report [skip ci]" || exit 0
          git push
