name: Test last time (temporary)
on:
  push:
    branches: [claude/last-time]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py > run-log.txt 2>&1 || true
      - run: |
          git config user.name "economy-bot"
          git config user.email "economy-bot@users.noreply.github.com"
          git add data.json run-log.txt
          git commit -m "Test run output" || true
          git push
