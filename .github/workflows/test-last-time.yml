name: Test last time (temporary)
on:
  push:
    branches: [claude/last-time]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe/yprobe.py > probe-log.txt 2>&1 || true
      - run: curl -s -o /dev/null -w "curl %{http_code}\n" "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?period1=1072915200&period2=1793099297&interval=1mo" >> probe-log.txt || true
      - run: |
          git config user.name "economy-bot"
          git config user.email "economy-bot@users.noreply.github.com"
          git add probe-log.txt
          git commit -m "Test run output" || true
          git push
