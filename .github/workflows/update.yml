name: Update economy data

on:
  schedule:
    - cron: "17 6 * * *"   # every day at about 07:17 UK time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the data and work out the readings
        run: python scripts/update.py

      - name: Save the new data file
        if: always()
        run: |
          git config user.name "economy-bot"
          git config user.email "economy-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update data"
          git push

      - name: Ask GitHub Pages to refresh the page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
