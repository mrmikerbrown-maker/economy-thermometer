name: Calendar fetch test (temporary)
on:
  push:
    branches: [claude/project-thread-nyd994]
    paths: [calendar-test/scripts/**]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 calendar-test/scripts/fetch.py
      - run: |
          git add calendar-test/data/
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898208+github-actions[bot]@users.noreply.github.com" commit -m "Calendar test data"
          git push
